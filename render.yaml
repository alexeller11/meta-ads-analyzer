services:
  - type: web
    name: meta-ads-analyzer-nvidia
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PNPM_VERSION
        value: "10.4.1"
